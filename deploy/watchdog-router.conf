# Hardware watchdog: systemd pets the PM8916 PON watchdog (max 127 s). If the kernel or PID 1 hangs (the
# unexplained freezes the black box recorded), the PMIC resets the stick after RuntimeWatchdogSec.
# RebootWatchdogSec covers a reboot/poweroff that gets stuck. Installed as
# /etc/systemd/system.conf.d/90-router-watchdog.conf; takes effect with "systemctl daemon-reexec".
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=2min
