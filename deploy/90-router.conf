# KStick router kernel settings
net.ipv4.ip_forward = 1
# loose reverse-path filter: required with two uplinks (LTE + USB) and health checks
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# default 2560 is too small for VPN + browser traffic of several clients (~300 B each)
net.netfilter.nf_conntrack_max = 16384
# zram swap (router-zram.service): swapping to compressed RAM is cheap, so prefer it over dropping file cache;
# read one page at a time (no readahead benefit on zram)
vm.swappiness = 100
vm.page-cluster = 0
